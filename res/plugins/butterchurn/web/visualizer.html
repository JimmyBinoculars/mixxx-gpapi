<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Butterchurn</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            /* The host keeps the window at 16:9; the canvas fills it. */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #canvas {
            display: block;
        }
        #error {
            position: absolute;
            inset: 0;
            display: none;
            color: #f66;
            background: #000;
            font: 14px/1.5 sans-serif;
            padding: 16px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="error"></div>

    <!-- Bundled Butterchurn (MIT) and the full preset packs. -->
    <script src="../lib/butterchurn.min.js"></script>
    <script src="../lib/butterchurnExtraImages.min.js"></script>
    <script src="../lib/butterchurnPresets.min.js"></script>
    <script src="../lib/butterchurnPresetsExtra.min.js"></script>
    <script src="../lib/butterchurnPresetsExtra2.min.js"></script>
    <script src="../lib/butterchurnPresetsMD1.min.js"></script>

    <!-- Qt WebChannel client, used to talk back to the host. -->
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>

    <script src="bridge.js"></script>
    <script src="app.js"></script>
</body>
</html>
